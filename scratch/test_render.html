<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; display: flex; align-items: center; justify-content: center; width: 1366px; height: 1024px; }
  .mri-stage {
    position: relative;
    width: 1366px;
    height: 1024px;
    overflow: hidden;
  }
  .mri-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .mri-parts-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .mri-hotspot {
    position: absolute;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
  }
  .mri-hotspot-switch {
    top: 11.6%;
    left: 77.0%;
    width: 7%;
    height: 8%;
    border: 1px dashed yellow;
  }
  .mri-pulse-ring {
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 3px solid #00e5ff;
    box-shadow: 0 0 12px #00e5ff, inset 0 0 12px #00e5ff;
  }
  .mri-hotspot-label {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(0, 229, 255, 0.6);
    color: #e0f2fe;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    white-space: nowrap;
    margin-top: 50px;
  }
</style>
</head>
<body>
  <div class="mri-stage">
    <img class="mri-layer" src="../assets/MRIRoomLightsOn.png" />
    <div class="mri-parts-layer">
      <div class="mri-hotspot mri-hotspot-switch">
        <span class="mri-pulse-ring"></span>
        <span class="mri-hotspot-label">Turn Off Lights</span>
      </div>
    </div>
  </div>
</body>
</html>
